[tool.uv.workspace]
members = ["packages/twindex-core", "packages/twindex-cli"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "hypothesis>=6,<7", "build>=1,<2", "setuptools>=77", "wheel", "ruff==0.15.21", "mypy==2.2.0"]

[tool.pytest.ini_options]
testpaths = ["packages/twindex-core/tests", "packages/twindex-cli/tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
