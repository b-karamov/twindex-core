[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twindex-core"
version = "0.1.0a1"
description = "Local knowledge inbox, changesets, and cited retrieval"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Bulat Karamov"}]
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "httpcore>=1,<2",
  "pydantic>=2.9,<3",
  "pypdf>=5,<7",
  "pypdfium2>=4,<6",
  "Pillow>=10,<13",
  "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
semantic = ["chromadb>=1,<2"]
test = ["pytest>=8,<10", "hypothesis>=6,<7"]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "chromadb>=1,<2", "build>=1,<2",
       "ruff>=0.12,<1", "mypy>=1.15,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/b-karamov/twindex-core"
Issues = "https://github.com/b-karamov/twindex-core/issues"
